<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ireboot-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="16" y1="8" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Tech Squircle -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="#090a0f" stroke="url(#ireboot-grad)" stroke-width="2" />
  
  <!-- Subtle Internal Glow Grid -->
  <rect x="6" y="6" width="36" height="36" rx="9" fill="url(#ireboot-grad)" fill-opacity="0.08" />

  <!-- Reboot Circular Arc (Symbolizing Reboot / Revival) -->
  <path d="M 24 10 A 14 14 0 1 1 14 18.5" fill="none" stroke="url(#accent-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Reboot Arrow Head -->
  <polygon points="14,12 14,21 23,17" fill="#38bdf8" />

  <!-- Center Smartphone Silicon / Power Pulse Core -->
  <rect x="21" y="19" width="6" height="11" rx="2" fill="url(#ireboot-grad)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="24" cy="27.5" r="0.8" fill="#ffffff" />
</svg>
